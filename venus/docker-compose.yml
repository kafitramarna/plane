# VenusVerse prod stack: full plane community behind Nginx Proxy Manager.
# Adapted from upstream docker-compose.yml — consolidated env_file (root .env)
# and the proxy joins app-network + binds 127.0.0.1:3030 for NPM forwarding.
# CI copies this file to /opt/apps/plane/docker-compose.yml before deploy-app.

services:
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        DOCKER_BUILDKIT: 1
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_WEB_BASE_URL: ${VITE_WEB_BASE_URL}
        VITE_ADMIN_BASE_URL: ${VITE_ADMIN_BASE_URL}
        VITE_ADMIN_BASE_PATH: ${VITE_ADMIN_BASE_PATH:-/god-mode}
        VITE_SPACE_BASE_URL: ${VITE_SPACE_BASE_URL}
        VITE_SPACE_BASE_PATH: ${VITE_SPACE_BASE_PATH:-/spaces}
        VITE_LIVE_BASE_URL: ${VITE_LIVE_BASE_URL}
        VITE_LIVE_BASE_PATH: ${VITE_LIVE_BASE_PATH:-/live}
    restart: always
    # bare names (web/api/admin/space/live) resolve to foreign containers on
    # the shared app-network — the proxy reaches us via these unique aliases.
    networks:
      default:
        aliases: [plane-web]
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        DOCKER_BUILDKIT: 1
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_WEB_BASE_URL: ${VITE_WEB_BASE_URL}
        VITE_ADMIN_BASE_URL: ${VITE_ADMIN_BASE_URL}
        VITE_ADMIN_BASE_PATH: ${VITE_ADMIN_BASE_PATH:-/god-mode}
        VITE_SPACE_BASE_URL: ${VITE_SPACE_BASE_URL}
        VITE_SPACE_BASE_PATH: ${VITE_SPACE_BASE_PATH:-/spaces}
        VITE_LIVE_BASE_URL: ${VITE_LIVE_BASE_URL}
        VITE_LIVE_BASE_PATH: ${VITE_LIVE_BASE_PATH:-/live}
    restart: always
    networks:
      default:
        aliases: [plane-admin]
    depends_on:
      - api
      - web

  space:
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        DOCKER_BUILDKIT: 1
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_WEB_BASE_URL: ${VITE_WEB_BASE_URL}
        VITE_ADMIN_BASE_URL: ${VITE_ADMIN_BASE_URL}
        VITE_ADMIN_BASE_PATH: ${VITE_ADMIN_BASE_PATH:-/god-mode}
        VITE_SPACE_BASE_URL: ${VITE_SPACE_BASE_URL}
        VITE_SPACE_BASE_PATH: ${VITE_SPACE_BASE_PATH:-/spaces}
        VITE_LIVE_BASE_URL: ${VITE_LIVE_BASE_URL}
        VITE_LIVE_BASE_PATH: ${VITE_LIVE_BASE_PATH:-/live}
    restart: always
    networks:
      default:
        aliases: [plane-space]
    depends_on:
      - api
      - web

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - .env
    networks:
      default:
        aliases: [plane-api]
    depends_on:
      - plane-db
      - plane-redis

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - .env
    depends_on:
      - api
      - plane-db
      - plane-redis

  beat-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - .env
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - .env
    depends_on:
      - plane-db
      - plane-redis

  live:
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_LIVE_BASE_URL: ${VITE_LIVE_BASE_URL}
        VITE_LIVE_BASE_PATH: ${VITE_LIVE_BASE_PATH:-/live}
        VITE_LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
    restart: always
    env_file:
      - .env
    networks:
      default:
        aliases: [plane-live]

  plane-db:
    image: postgres:15.7-alpine
    restart: always
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: always
    volumes:
      - redisdata:/data

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

  # Single entry for NPM: / → web, /api /auth /static → api, /spaces → space,
  # /god-mode → admin, /live → live, /uploads → minio.
  proxy:
    build:
      context: .
      dockerfile: venus/Dockerfile.proxy
    restart: always
    ports:
      - "127.0.0.1:3030:80"
    environment:
      # CERT_* left unset on purpose — empty values break the Caddyfile
      # 'acme_ca' directive; its built-in defaults handle plain :80 fine.
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-0.0.0.0/0}
    networks:
      - default
      - app-network
    depends_on:
      - web
      - api
      - space
      - admin

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:

networks:
  app-network:
    external: true
